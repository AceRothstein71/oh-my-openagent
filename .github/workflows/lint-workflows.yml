name: Lint Workflows

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install actionlint
        run: |
          set -euo pipefail
          # Download the pinned release binary directly instead of piping the
          # raw.githubusercontent install script into bash. Raw content fetches
          # get 429-rate-limited under CI load, which makes bash try to execute
          # the error page (see 2026-08-17 Lint Workflows outage).
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_amd64.tar.gz
          echo "f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          rm actionlint.tar.gz

      - name: Run actionlint
        run: ./actionlint -color -shellcheck=""

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Workflow lint
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Downloads the pinned actionlint release.
            - Validates every workflow changed in this repository.
          JOB_SUMMARY_NEXT: Fix the first actionlint diagnostic; most failures point to an exact workflow line.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
